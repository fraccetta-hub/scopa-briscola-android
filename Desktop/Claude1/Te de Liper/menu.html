<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú — El Rincón de Liper · Salón de Té</title>
  <meta name="description" content="Menú del Salón de Té El Rincón de Liper. Tés especiales, bebidas frías, tradición paraguaya y dulces artesanales en Recoleta, Asunción." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cl-beige-0:#fdf9f4; --cl-beige-1:#f5ece0; --cl-beige-2:#e8d5ba; --cl-beige-3:#d4b896;
      --cl-sage-1:#b8c9a8;  --cl-sage-2:#8a9e7a;  --cl-sage-3:#667a54;
      --cl-terra-1:#dda07c; --cl-terra-2:#c4714e; --cl-terra-3:#9e5536;
      --cl-ink-0:#2e1f14;   --cl-ink-1:#5c4030;   --cl-ink-2:#8a7060;   --cl-ink-3:#b09880;
      --cl-white:#ffffff;
      --sh-sm:0 2px 8px rgba(46,31,20,.08); --sh-md:0 4px 16px rgba(46,31,20,.12); --sh-lg:0 8px 40px rgba(46,31,20,.22);
      --r-sm:8px; --r-md:16px; --r-lg:24px; --r-pill:100px;
      --tr:.3s ease;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;font-size:16px;}
    body{font-family:'Lato',sans-serif;background:var(--cl-beige-0);color:var(--cl-ink-0);line-height:1.7;overflow-x:hidden;}
    h1,h2,h3,h4{font-family:'Playfair Display',serif;line-height:1.25;}
    a{color:inherit;text-decoration:none;}
    ul{list-style:none;}
    button{cursor:pointer;font-family:inherit;}
    img{display:block;max-width:100%;}

    /* ── Navbar ── */
    .nav{position:fixed;inset-block-start:0;inset-inline:0;z-index:900;padding:.9rem 0;transition:background var(--tr),box-shadow var(--tr);}
    .nav.scrolled{background:rgba(253,249,244,.96);backdrop-filter:blur(10px);box-shadow:var(--sh-sm);}
    .nav__inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1100px;margin:0 auto;padding:0 1.5rem;}
    .nav__logo img{height:44px;width:auto;display:block;}
    .nav__right{display:flex;align-items:center;gap:1.5rem;}
    .nav__link{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cl-ink-1);transition:color var(--tr);}
    .nav__link:hover{color:var(--cl-terra-2);}
    .nav:not(.scrolled) .nav__link{color:rgba(253,249,244,.92);text-shadow:0 1px 4px rgba(0,0,0,.4);}
    .nav:not(.scrolled) .nav__link:hover{color:var(--cl-white);}
    .lang{display:flex;gap:.2rem;}
    .lang__btn{background:none;border:1px solid transparent;padding:.18rem .45rem;border-radius:var(--r-sm);font-size:.7rem;font-weight:700;letter-spacing:.05em;color:var(--cl-ink-3);transition:all var(--tr);}
    .lang__btn.active,.lang__btn:hover{color:var(--cl-terra-2);border-color:var(--cl-terra-2);}
    .nav:not(.scrolled) .lang__btn{color:rgba(253,249,244,.65);}
    .nav:not(.scrolled) .lang__btn.active,.nav:not(.scrolled) .lang__btn:hover{color:var(--cl-white);border-color:rgba(253,249,244,.6);}
    .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:4px;}
    .hamburger span{display:block;width:22px;height:2px;background:var(--cl-ink-0);border-radius:2px;transition:all var(--tr);}
    .nav:not(.scrolled) .hamburger span{background:var(--cl-white);}
    .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    .hamburger.open span:nth-child(2){opacity:0;}
    .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
    .mobile-drawer{display:none;flex-direction:column;gap:1rem;padding:.75rem 1.5rem 1.5rem;background:rgba(253,249,244,.97);backdrop-filter:blur(10px);}
    .mobile-drawer.open{display:flex;}
    .mobile-drawer .nav__link{font-size:.88rem;}

    /* ── Page Header ── */
    .page-header{position:relative;min-height:38vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;}
    .page-header__bg{position:absolute;inset:0;background-color:#7a5538;background-image:url('Images/img2.png');background-size:cover;background-position:center top;}
    .page-header__overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(46,31,20,.45) 0%,rgba(46,31,20,.65) 100%);}
    .page-header__content{position:relative;z-index:1;padding:7rem 1.5rem 3rem;}
    .page-header__eyebrow{display:block;font-size:.72rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(253,249,244,.7);margin-bottom:1rem;}
    .page-header__logo{display:block;width:min(260px,55vw);height:auto;margin:0 auto 1.25rem;filter:drop-shadow(0 2px 12px rgba(0,0,0,.4));}
    .page-header__sub{font-size:.9rem;font-weight:300;color:rgba(253,249,244,.75);letter-spacing:.08em;}
    .print-link{position:absolute;bottom:1.25rem;right:1.5rem;z-index:2;display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .9rem;border:1px solid rgba(253,249,244,.45);border-radius:var(--r-pill);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(253,249,244,.7);transition:all var(--tr);}
    .print-link:hover{background:rgba(253,249,244,.15);color:var(--cl-white);}
    .print-link svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

    /* ── Menu Section ── */
    .menu-section{padding:3rem 0 6rem;}
    .container{width:100%;max-width:1100px;margin:0 auto;padding:0 1.5rem;}

    /* ── Category Tabs ── */
    .cat-tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:.5rem;margin-bottom:2.75rem;padding-bottom:.25rem;scrollbar-width:none;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{flex-shrink:0;padding:.48rem 1.2rem;background:none;border:1.5px solid var(--cl-beige-3);border-radius:var(--r-pill);font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--cl-ink-2);transition:all var(--tr);white-space:nowrap;}
    .cat-tab:hover,.cat-tab.active{background:var(--cl-terra-2);border-color:var(--cl-terra-2);color:var(--cl-white);}

    /* ── Items Grid ── */
    .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.25rem;}
    .cat-section{display:none;}
    .cat-section.active{display:block;animation:fadeUp .3s ease both;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .cat-title{font-size:1.45rem;color:var(--cl-ink-0);margin-bottom:.3rem;}
    .cat-desc{font-size:.86rem;color:var(--cl-ink-2);font-weight:300;margin-bottom:1.75rem;}

    /* ── Item Card ── */
    .item-card{background:var(--cl-white);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;transition:box-shadow var(--tr),transform var(--tr);}
    .item-card:hover{box-shadow:var(--sh-md);transform:translateY(-4px);}
    .item-card__visual{height:150px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden;}
    .item-card__visual::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.08));}
    .item-card__body{padding:1.1rem 1.2rem 1.2rem;}
    .item-card__name{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;color:var(--cl-ink-0);margin-bottom:.3rem;}
    .item-card__desc{font-size:.8rem;color:var(--cl-ink-2);font-weight:300;line-height:1.55;margin-bottom:.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .item-card__footer{display:flex;align-items:center;justify-content:space-between;}
    .item-card__price{font-family:'Playfair Display',serif;font-size:.98rem;font-weight:600;color:var(--cl-terra-2);}
    .item-card__btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--cl-beige-1);border:none;color:var(--cl-ink-1);font-size:1.2rem;transition:all var(--tr);}
    .item-card__btn:hover{background:var(--cl-terra-2);color:var(--cl-white);}

    /* Category gradient colors */
    .grad-hot    {background:linear-gradient(135deg,#c4714e 0%,#9e5536 100%);}
    .grad-iced   {background:linear-gradient(135deg,#8a9e7a 0%,#5a7a4a 100%);}
    .grad-py     {background:linear-gradient(135deg,#667a54 0%,#4a5e3a 100%);}
    .grad-coffee {background:linear-gradient(135deg,#6b4226 0%,#3e2010 100%);}
    .grad-bottles{background:linear-gradient(135deg,#8a9e7a 0%,#c4714e 100%);}
    .grad-pancakes{background:linear-gradient(135deg,#dda07c 0%,#c4714e 100%);}
    .grad-sweets {background:linear-gradient(135deg,#d4a0b0 0%,#c4714e 100%);}

    /* ── Item Modal ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(46,31,20,.55);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity var(--tr);}
    .modal-overlay.open{opacity:1;pointer-events:all;}
    .modal{background:var(--cl-white);border-radius:var(--r-lg);max-width:520px;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(20px) scale(.97);transition:transform var(--tr);scrollbar-width:thin;}
    .modal-overlay.open .modal{transform:translateY(0) scale(1);}
    .modal__visual{height:200px;display:flex;align-items:center;justify-content:center;font-size:4.5rem;border-radius:var(--r-lg) var(--r-lg) 0 0;position:relative;}
    .modal__close{position:absolute;top:1rem;right:1rem;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);border:none;font-size:1.1rem;display:flex;align-items:center;justify-content:center;color:var(--cl-ink-0);transition:all var(--tr);}
    .modal__close:hover{background:var(--cl-white);box-shadow:var(--sh-sm);}
    .modal__body{padding:1.5rem 1.75rem 2rem;}
    .modal__name{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:600;color:var(--cl-ink-0);margin-bottom:.5rem;}
    .modal__desc{font-size:.92rem;color:var(--cl-ink-1);font-weight:300;line-height:1.75;margin-bottom:1rem;}
    .modal__detail{font-size:.85rem;color:var(--cl-ink-2);font-weight:300;line-height:1.7;margin-bottom:1.2rem;padding:1rem;background:var(--cl-beige-0);border-radius:var(--r-sm);}
    .modal__tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.5rem;}
    .modal__tag{padding:.22rem .75rem;background:var(--cl-beige-1);border-radius:var(--r-pill);font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--cl-ink-1);}
    .modal__tag--green{background:#e8f2e0;color:#4a7a3a;}
    .modal__tag--orange{background:#faeee7;color:var(--cl-terra-3);}
    .modal__footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
    .modal__price{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:600;color:var(--cl-terra-2);}
    .modal__qty{display:flex;align-items:center;gap:.6rem;}
    .qty-btn{width:32px;height:32px;border-radius:50%;background:var(--cl-beige-1);border:none;font-size:1.1rem;display:flex;align-items:center;justify-content:center;color:var(--cl-ink-0);transition:all var(--tr);}
    .qty-btn:hover{background:var(--cl-beige-2);}
    .qty-val{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;min-width:24px;text-align:center;}
    .modal__add{flex:1;min-width:160px;padding:.85rem 1.5rem;background:var(--cl-terra-2);color:var(--cl-white);border:none;border-radius:var(--r-pill);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:all var(--tr);}
    .modal__add:hover{background:var(--cl-terra-3);transform:translateY(-1px);box-shadow:0 4px 14px rgba(196,113,78,.38);}
    .modal__added{display:none;background:var(--cl-sage-2);color:var(--cl-white);}

    /* ── Cart FAB ── */
    .cart-fab{position:fixed;bottom:2rem;right:2rem;z-index:800;display:flex;align-items:center;gap:.6rem;padding:.75rem 1.4rem;background:var(--cl-terra-2);color:var(--cl-white);border:none;border-radius:var(--r-pill);font-size:.88rem;font-weight:700;letter-spacing:.05em;box-shadow:0 4px 20px rgba(196,113,78,.45);transition:all var(--tr);}
    .cart-fab:hover{background:var(--cl-terra-3);transform:translateY(-2px);box-shadow:0 6px 24px rgba(196,113,78,.5);}
    .cart-fab__count{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--cl-white);color:var(--cl-terra-2);border-radius:50%;font-size:.75rem;font-weight:700;}
    .cart-fab.hidden{opacity:0;pointer-events:none;transform:translateY(10px);}

    /* ── Cart Panel ── */
    .cart-overlay{position:fixed;inset:0;background:rgba(46,31,20,.4);z-index:1100;opacity:0;pointer-events:none;transition:opacity var(--tr);}
    .cart-overlay.open{opacity:1;pointer-events:all;}
    .cart-panel{position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,100vw);background:var(--cl-white);z-index:1200;display:flex;flex-direction:column;box-shadow:-4px 0 32px rgba(46,31,20,.18);transform:translateX(100%);transition:transform var(--tr);}
    .cart-panel.open{transform:translateX(0);}
    .cart-panel__head{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 1.5rem 1rem;border-bottom:1px solid var(--cl-beige-1);}
    .cart-panel__title{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:600;color:var(--cl-ink-0);}
    .cart-close{background:none;border:none;font-size:1.3rem;color:var(--cl-ink-2);padding:.25rem;}
    .cart-close:hover{color:var(--cl-ink-0);}
    .cart-items{flex:1;overflow-y:auto;padding:1rem 1.5rem;display:flex;flex-direction:column;gap:.75rem;}
    .cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cl-ink-3);font-size:.9rem;gap:.75rem;padding:2rem;}
    .cart-empty__icon{font-size:3rem;opacity:.4;}
    .cart-item{display:flex;align-items:center;gap.75rem;padding:.9rem;background:var(--cl-beige-0);border-radius:var(--r-md);}
    .cart-item{display:flex;align-items:center;gap:.75rem;padding:.85rem;background:var(--cl-beige-0);border-radius:var(--r-md);}
    .cart-item__icon{font-size:1.6rem;flex-shrink:0;width:38px;text-align:center;}
    .cart-item__info{flex:1;min-width:0;}
    .cart-item__name{font-size:.88rem;font-weight:700;color:var(--cl-ink-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cart-item__price{font-size:.8rem;color:var(--cl-terra-2);font-family:'Playfair Display',serif;font-weight:600;}
    .cart-item__qty{display:flex;align-items:center;gap:.4rem;flex-shrink:0;}
    .cqty-btn{width:26px;height:26px;border-radius:50%;background:var(--cl-beige-2);border:none;font-size:.95rem;display:flex;align-items:center;justify-content:center;color:var(--cl-ink-0);transition:all var(--tr);}
    .cqty-btn:hover{background:var(--cl-beige-3);}
    .cqty-val{font-size:.88rem;font-weight:700;min-width:18px;text-align:center;}
    .cart-remove{background:none;border:none;color:var(--cl-ink-3);font-size:1rem;padding:.2rem;transition:color var(--tr);}
    .cart-remove:hover{color:#c43030;}
    .cart-footer{padding:1.25rem 1.5rem;border-top:1px solid var(--cl-beige-1);}
    .cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;}
    .cart-total__label{font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cl-ink-2);}
    .cart-total__val{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:600;color:var(--cl-ink-0);}
    .cart-btns{display:flex;flex-direction:column;gap:.65rem;}
    .btn-counter{width:100%;padding:.9rem;background:var(--cl-terra-2);color:var(--cl-white);border:none;border-radius:var(--r-pill);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:all var(--tr);}
    .btn-counter:hover{background:var(--cl-terra-3);}
    .btn-online{width:100%;padding:.9rem;background:none;color:var(--cl-terra-2);border:1.5px solid var(--cl-terra-2);border-radius:var(--r-pill);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:all var(--tr);}
    .btn-online:hover{background:var(--cl-terra-2);color:var(--cl-white);}

    /* ── Order Success Modal ── */
    .order-modal{position:fixed;inset:0;background:rgba(46,31,20,.55);backdrop-filter:blur(4px);z-index:1300;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity var(--tr);}
    .order-modal.open{opacity:1;pointer-events:all;}
    .order-modal__box{background:var(--cl-white);border-radius:var(--r-lg);max-width:400px;width:100%;padding:2.5rem 2rem;text-align:center;transform:scale(.95);transition:transform var(--tr);}
    .order-modal.open .order-modal__box{transform:scale(1);}
    .order-modal__icon{font-size:3.5rem;margin-bottom:1rem;}
    .order-modal__title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:600;color:var(--cl-ink-0);margin-bottom:.6rem;}
    .order-modal__sub{font-size:.9rem;color:var(--cl-ink-2);font-weight:300;line-height:1.7;margin-bottom:1.75rem;}
    .order-modal__ok{padding:.8rem 2.5rem;background:var(--cl-terra-2);color:var(--cl-white);border:none;border-radius:var(--r-pill);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:all var(--tr);}
    .order-modal__ok:hover{background:var(--cl-terra-3);}

    /* ── Footer ── */
    footer{background:var(--cl-ink-0);color:rgba(253,249,244,.55);text-align:center;padding:2.25rem 1rem;font-size:.8rem;font-weight:300;letter-spacing:.04em;line-height:1.9;}
    footer strong{font-family:'Playfair Display',serif;color:rgba(253,249,244,.9);}

    /* ── Responsive ── */
    @media(max-width:880px){
      .nav__right .nav__link{display:none;}
      .hamburger{display:flex;}
    }
    @media(max-width:600px){
      .items-grid{grid-template-columns:1fr 1fr;}
      .item-card__visual{height:120px;font-size:2.4rem;}
      .cart-panel{width:100vw;}
      .cart-fab{bottom:1.25rem;right:1.25rem;}
    }
    @media(max-width:400px){
      .items-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="nav" id="navbar">
  <div class="nav__inner">
    <a href="index.html" class="nav__logo">
      <img src="Images/logo.png" alt="El Rincón de Liper" id="navLogo" />
    </a>
    <div class="nav__right" id="desktopRight">
      <a href="index.html" class="nav__link" data-i18n="nav_home"></a>
      <a href="index.html#chi-siamo" class="nav__link" data-i18n="nav_about"></a>
      <a href="index.html#contatti" class="nav__link" data-i18n="nav_contact"></a>
      <div class="lang" id="langSwitcher">
        <button class="lang__btn" data-lang="es">ES</button>
        <button class="lang__btn" data-lang="en">EN</button>
        <button class="lang__btn" data-lang="fr">FR</button>
        <button class="lang__btn" data-lang="de">DE</button>
        <button class="lang__btn" data-lang="it">IT</button>
      </div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
  <div class="mobile-drawer" id="drawer">
    <a href="index.html" class="nav__link" data-i18n="nav_home"></a>
    <a href="index.html#chi-siamo" class="nav__link" data-i18n="nav_about"></a>
    <a href="index.html#contatti" class="nav__link" data-i18n="nav_contact"></a>
    <div class="lang">
      <button class="lang__btn" data-lang="es">ES</button>
      <button class="lang__btn" data-lang="en">EN</button>
      <button class="lang__btn" data-lang="fr">FR</button>
      <button class="lang__btn" data-lang="de">DE</button>
      <button class="lang__btn" data-lang="it">IT</button>
    </div>
  </div>
</nav>

<!-- PAGE HEADER -->
<header class="page-header">
  <div class="page-header__bg"></div>
  <div class="page-header__overlay"></div>
  <div class="page-header__content">
    <span class="page-header__eyebrow" data-i18n="header_eyebrow"></span>
    <img src="Images/logow.png" alt="El Rincón de Liper" class="page-header__logo" />
    <span class="page-header__sub" data-i18n="header_sub"></span>

/* Category meta */
const CATS = [
  { id:'hot',      icon:'🍵', grad:'grad-hot',      key:'cat_hot'      },
  { id:'iced',     icon:'🧊', grad:'grad-iced',     key:'cat_iced'     },
  { id:'py',       icon:'🧉', grad:'grad-py',       key:'cat_py'       },
  { id:'coffee',   icon:'☕', grad:'grad-coffee',   key:'cat_coffee'   },
  { id:'bottles',  icon:'🫙', grad:'grad-bottles',  key:'cat_bottles'  },
  { id:'pancakes', icon:'🥞', grad:'grad-pancakes', key:'cat_pancakes' },
  { id:'sweets',   icon:'🍰', grad:'grad-sweets',   key:'cat_sweets'   }
];

/* ================================================================
   i18n
================================================================ */
let lang = localStorage.getItem('liper_lang') || 'es';
function t(k){ return (TR[lang]&&TR[lang][k]) || (TR.es&&TR.es[k]) || k; }

function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('.lang__btn').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  document.documentElement.lang = lang;
  renderMenu();
}
function setLang(l){ if(!TR[l]) return; lang=l; localStorage.setItem('liper_lang',l); applyLang(); }
document.querySelectorAll('.lang__btn').forEach(b => b.addEventListener('click',()=>setLang(b.dataset.lang)));

/* ================================================================
   RENDER MENU
================================================================ */
let activeCat = CATS[0].id;

function renderMenu(){
  /* tabs */
  document.getElementById('catTabs').innerHTML = CATS.map(c=>`
    <button class="cat-tab${c.id===activeCat?' active':''}" data-cat="${c.id}">
      ${c.icon} ${t(c.key)}
    </button>`).join('');

  /* sections */
  document.getElementById('menuContent').innerHTML = CATS.map(c=>{
    const items = MENU.filter(i=>i.cat===c.id);
    return `<div class="cat-section${c.id===activeCat?' active':''}" id="sec-${c.id}">
      <div class="items-grid">${items.map((item,idx)=>cardHtml(item,idx)).join('')}</div>
    </div>`;
  }).join('');

  /* tab click */
  document.getElementById('catTabs').addEventListener('click', e=>{
    const btn = e.target.closest('.cat-tab');
    if(!btn) return;
    activeCat = btn.dataset.cat;
    document.querySelectorAll('.cat-tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===activeCat));
    document.querySelectorAll('.cat-section').forEach(s=>s.classList.toggle('active',s.id==='sec-'+activeCat));
  },{once:true});

  /* card click */
  document.querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', ()=> openModal(card.dataset.itemId));
  });
}

function cardHtml(item, idx){
  const itemId = MENU.indexOf(item);
  return `<div class="item-card" data-item-id="${itemId}" role="button" tabindex="0"
    aria-label="${item.name}">
    <div class="item-card__visual ${item.grad}">${item.icon}</div>
    <div class="item-card__body">
      <h3 class="item-card__name">${item.name}</h3>
      <p class="item-card__desc">${item.desc[lang]||item.desc.es}</p>
      <div class="item-card__footer">
        <span class="item-card__price">Gs. ${item.price}</span>
        <button class="item-card__btn" aria-label="Ver detalles">+</button>
      </div>
    </div>
  </div>`;
}

/* ================================================================
   MODAL
================================================================ */
let modalQty = 1;
let currentItem = null;

function openModal(itemId){
  currentItem = MENU[itemId];
  if(!currentItem) return;
  modalQty = 1;
  document.getElementById('qtyVal').textContent = 1;

  const vis = document.getElementById('modalVisual');
  vis.className = `modal__visual ${currentItem.grad}`;
  vis.querySelector('button') || vis.appendChild(document.getElementById('modalClose'));

  document.getElementById('modalName').textContent   = currentItem.name;
  document.getElementById('modalDesc').textContent   = currentItem.desc[lang]||currentItem.desc.es;
  document.getElementById('modalDetail').textContent = currentItem.detail[lang]||currentItem.detail.es;
  document.getElementById('modalPrice').textContent  = 'Gs. '+currentItem.price;

  /* emoji in visual */
  let emojiEl = vis.querySelector('.modal-emoji');
  if(!emojiEl){ emojiEl = document.createElement('span'); emojiEl.className='modal-emoji'; emojiEl.style.cssText='font-size:4.5rem;position:relative;z-index:1;'; vis.insertBefore(emojiEl, vis.firstChild); }
  emojiEl.textContent = currentItem.icon;

  /* tags */
  document.getElementById('modalTags').innerHTML = currentItem.tags.map(tag=>`
    <span class="modal__tag${tag.type==='green'?' modal__tag--green':tag.type==='orange'?' modal__tag--orange':''}">${tag.l}</span>`
  ).join('');

  /* add button text */
  const addBtn = document.getElementById('modalAddBtn');
  addBtn.textContent = t('add_cart');
  addBtn.classList.remove('modal__added');
  addBtn.onclick = ()=>{ addToCart(currentItem, modalQty); flashAdded(); };

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}

function flashAdded(){
  const btn = document.getElementById('modalAddBtn');
  btn.classList.add('modal__added');
  btn.textContent = '✓ '+t('add_cart');
  setTimeout(()=>{ btn.classList.remove('modal__added'); btn.textContent=t('add_cart'); }, 1400);
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').onclick = e=>{ if(e.target===document.getElementById('modalOverlay')) closeModal(); };
document.getElementById('qtyMinus').onclick = ()=>{ if(modalQty>1){ modalQty--; document.getElementById('qtyVal').textContent=modalQty; }};
document.getElementById('qtyPlus').onclick  = ()=>{ if(modalQty<99){ modalQty++; document.getElementById('qtyVal').textContent=modalQty; }};

/* ================================================================
   CART
================================================================ */
let cart = [];

function addToCart(item, qty){
  const existing = cart.find(c=>c.item===item);
  if(existing) existing.qty += qty;
  else cart.push({item, qty});
  updateCart();
}

function updateCart(){
  const total = cart.reduce((s,c)=>s+c.qty,0);
  const fab = document.getElementById('cartFab');
  document.getElementById('cartFabCount').textContent = total;
  fab.classList.toggle('hidden', total===0);
  renderCartItems();
}

function renderCartItems(){
  const container = document.getElementById('cartItems');
  const footer    = document.getElementById('cartFooter');
  if(cart.length===0){
    container.innerHTML=`<div class="cart-empty"><div class="cart-empty__icon">🛒</div><span>${t('cart_empty')}</span></div>`;
    footer.style.display='none';
    return;
  }
  footer.style.display='block';
  container.innerHTML = cart.map((c,i)=>{
    const priceNum = parseInt(c.item.price.replace('.',''),10);
    const subtotal = (priceNum*c.qty).toLocaleString('es');
    return `<div class="cart-item">
      <span class="cart-item__icon">${c.item.icon}</span>
      <div class="cart-item__info">
        <div class="cart-item__name">${c.item.name}</div>
        <div class="cart-item__price">Gs. ${subtotal}</div>
      </div>
      <div class="cart-item__qty">
        <button class="cqty-btn" data-idx="${i}" data-op="minus">−</button>
        <span class="cqty-val">${c.qty}</span>
        <button class="cqty-btn" data-idx="${i}" data-op="plus">+</button>
      </div>
      <button class="cart-remove" data-idx="${i}" aria-label="Eliminar">✕</button>
    </div>`;
  }).join('');

  /* total */
  const totalGs = cart.reduce((s,c)=>{
    const n = parseInt(c.item.price.replace('.',''),10);
    return s + n*c.qty;
  },0);
  document.getElementById('cartTotal').textContent = 'Gs. '+totalGs.toLocaleString('es');

  /* qty / remove buttons */
  container.querySelectorAll('.cqty-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.dataset.idx);
      if(btn.dataset.op==='plus') cart[i].qty++;
      else if(cart[i].qty>1) cart[i].qty--;
      else cart.splice(i,1);
      updateCart();
    };
  });
  container.querySelectorAll('.cart-remove').forEach(btn=>{
    btn.onclick = ()=>{ cart.splice(parseInt(btn.dataset.idx),1); updateCart(); };
  });
}

/* Cart open/close */
function openCart(){ document.getElementById('cartPanel').classList.add('open'); document.getElementById('cartOverlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closeCart(){ document.getElementById('cartPanel').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('open'); document.body.style.overflow=''; }

document.getElementById('cartFab').onclick    = openCart;
document.getElementById('cartClose').onclick  = closeCart;
document.getElementById('cartOverlay').onclick = closeCart;

/* Checkout buttons */
document.getElementById('btnCounter').onclick = ()=>{
  closeCart();
  showOrderModal('counter');
};
document.getElementById('btnOnline').onclick = ()=>{
  closeCart();
  showOrderModal('online');
};

/* ================================================================
   ORDER CONFIRMATION MODAL
================================================================ */
function showOrderModal(type){
  document.getElementById('orderIcon').textContent  = type==='counter' ? '✅' : '💳';
  document.getElementById('orderTitle').textContent = t(type==='counter'?'order_counter_title':'order_online_title');
  document.getElementById('orderSub').textContent   = t(type==='counter'?'order_counter_sub':'order_online_sub');
  document.getElementById('orderModal').classList.add('open');
  document.body.style.overflow='hidden';
  if(type==='counter'){ cart=[]; updateCart(); }
}

document.getElementById('orderOk').onclick = ()=>{
  document.getElementById('orderModal').classList.remove('open');
  document.body.style.overflow='';
  cart=[]; updateCart();
};

   NAVBAR SCROLL
================================================================ */

  document.getElementById('navbar').classList.toggle('scrolled', scrollY>44);
},{passive:true});

const drawer = document.getElementById('drawer');
ham.addEventListener('click',()=>{
  const open = drawer.classList.toggle('open');
  ham.classList.toggle('open',open);
});
drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{drawer.classList.remove('open');ham.classList.remove('open');}));

================================================================ */
applyLang();
document.getElementById('footerYear') && (document.getElementById('footerYear').textContent = new Date().getFullYear());
