<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Rincón de Liper — Salón de Té · Asunción</title>
  <meta name="description" content="Salón de Té en el barrio Recoleta de Asunción, Paraguay. Un rincón acogedor para pausar, saborear y reconectarse." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    /* ================================================
       VARIABLES — colori, tipografia, spacing
       Modifica qui per cambiare l'aspetto del sito
    ================================================ */
    :root {
      --cl-beige-0:    #fdf9f4;
      --cl-beige-1:    #f5ece0;
      --cl-beige-2:    #e8d5ba;
      --cl-beige-3:    #d4b896;
      --cl-sage-1:     #b8c9a8;
      --cl-sage-2:     #8a9e7a;
      --cl-sage-3:     #667a54;
      --cl-terra-1:    #dda07c;
      --cl-terra-2:    #c4714e;
      --cl-terra-3:    #9e5536;
      --cl-ink-0:      #2e1f14;
      --cl-ink-1:      #5c4030;
      --cl-ink-2:      #8a7060;
      --cl-ink-3:      #b09880;
      --cl-white:      #ffffff;
      --sh-sm:         0 2px 8px  rgba(46,31,20,.08);
      --sh-md:         0 4px 16px rgba(46,31,20,.12);
      --sh-lg:         0 8px 32px rgba(46,31,20,.18);
      --r-sm: 8px; --r-md: 16px; --r-lg: 24px; --r-pill: 100px;
      --tr: .3s ease;
    }

    /* ================================================
       RESET & BASE
    ================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html   { scroll-behavior: smooth; font-size: 16px; }
    body   { font-family: 'Lato', sans-serif; background: var(--cl-beige-0); color: var(--cl-ink-0); line-height: 1.7; overflow-x: hidden; }
    h1,h2,h3,h4 { font-family: 'Playfair Display', serif; line-height: 1.25; }
    a      { color: inherit; text-decoration: none; }
    ul     { list-style: none; }
    button { cursor: pointer; font-family: inherit; }
    img    { display: block; max-width: 100%; }

    /* ================================================
       UTILITY
    ================================================ */
    .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
    .section   { padding: 5.5rem 0; }

    .eyebrow {
      display: block;
      font-size: .75rem; font-weight: 700; letter-spacing: .25em;
      text-transform: uppercase; color: var(--cl-ink-2); margin-bottom: .75rem;
    }
    .title {
      font-size: clamp(1.9rem, 4vw, 2.75rem); color: var(--cl-ink-0);
    }
    .divider {
      width: 44px; height: 2px; background: var(--cl-terra-2);
      margin: 1.25rem 0;
    }
    .divider--center { margin: 1.25rem auto; }

    /* ================================================
       NAVBAR
    ================================================ */
    .nav {
      position: fixed; inset-block-start: 0; inset-inline: 0; z-index: 1000;
      padding: .9rem 0; transition: background var(--tr), box-shadow var(--tr);
    }
    .nav.scrolled {
      background: rgba(253,249,244,.96);
      backdrop-filter: blur(10px);
      box-shadow: var(--sh-sm);
    }
    .nav__inner {
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav__logo {
      display: flex; align-items: center;
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 1.35rem; color: var(--cl-ink-0); letter-spacing: .02em;
    }
    .nav__logo b { color: var(--cl-terra-2); font-style: normal; }
    /* Logo immagine — ridimensionato in base all'altezza navbar */
    .nav__logo-img {
      height: 46px; width: auto; display: block;
      transition: opacity var(--tr);
      /* Su sfondo trasparente (navbar non scrollata) potrebbe servire un filtro:
         filter: brightness(0) invert(1);  ← decommenta se logo scuro su hero */
    }
    .nav__logo:hover .nav__logo-img { opacity: .82; }

    .nav__links {
      display: flex; align-items: center; gap: 2rem;
    }
    .nav__links a {
      font-size: .8rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--cl-ink-1);
      transition: color var(--tr); position: relative;
    }
    .nav__links a::after {
      content: ''; position: absolute; bottom: -3px; left: 0; right: 100%;
      height: 1px; background: var(--cl-terra-2); transition: right var(--tr);
    }
    .nav__links a:hover { color: var(--cl-terra-2); }
    .nav__links a:hover::after { right: 0; }

    /* Language switcher */
    .lang {
      display: flex; gap: .25rem; margin-left: 1rem;
    }
    .lang__btn {
      background: none; border: 1px solid transparent;
      padding: .2rem .5rem; border-radius: var(--r-sm);
      font-size: .72rem; font-weight: 700; letter-spacing: .05em;
      color: var(--cl-ink-3); transition: all var(--tr);
    }
    .lang__btn.active, .lang__btn:hover {
      color: var(--cl-terra-2); border-color: var(--cl-terra-2);
    }

    /* Hamburger */
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; padding: 4px;
    }
    .hamburger span {
      display: block; width: 22px; height: 2px;
      background: var(--cl-ink-0); border-radius: 2px; transition: all var(--tr);
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile drawer */
    .mobile-drawer {
      display: none; flex-direction: column; gap: 1rem;
      padding: .75rem 1.5rem 1.5rem;
      background: rgba(253,249,244,.97); backdrop-filter: blur(10px);
    }
    .mobile-drawer.open { display: flex; }
    .mobile-drawer a {
      font-size: .9rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--cl-ink-1);
    }

    /* ================================================
       HERO
    ================================================ */
    .hero {
      min-height: 100svh; position: relative;
      display: flex; align-items: center; justify-content: center;
      text-align: center; overflow: hidden;
    }
    .hero__bg {
      position: absolute; inset: 0;
      background-color: #7a5538; /* fallback mentre carica */
      background-image: url('Images/img2.png');
      background-size: cover; background-position: center;
    }
    /* Vignetta calda sui bordi per dare profondità alla foto */
    .hero__bg::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 80% at 50% 50%, transparent 40%, rgba(46,31,20,.35) 100%);
    }
    .hero__overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        rgba(46,31,20,.30) 0%,
        rgba(46,31,20,.52) 55%,
        rgba(46,31,20,.70) 100%);
    }
    .hero__content {
      position: relative; z-index: 1;
      padding: 9rem 1.5rem 5rem; max-width: 760px;
    }
    .hero__eyebrow {
      font-size: .72rem; font-weight: 700; letter-spacing: .3em;
      text-transform: uppercase; color: rgba(253,249,244,.75); margin-bottom: 1.5rem;
    }
    .hero__title {
      font-size: clamp(2.8rem, 9vw, 6.5rem); font-weight: 700;
      color: var(--cl-white); text-shadow: 0 2px 24px rgba(46,31,20,.45);
      margin-bottom: 1.5rem; line-height: 1.05;
    }
    .hero__title em { font-style: italic; color: var(--cl-beige-2); }
    .hero__sub {
      font-size: clamp(.95rem, 2.2vw, 1.2rem); font-weight: 300;
      color: rgba(253,249,244,.82); max-width: 460px; margin: 0 auto 2.5rem;
      line-height: 1.85;
    }
    .hero__cta {
      display: inline-block; padding: .85rem 2.4rem;
      border: 1.5px solid rgba(253,249,244,.65); border-radius: var(--r-pill);
      color: var(--cl-white); font-size: .8rem; font-weight: 700;
      letter-spacing: .15em; text-transform: uppercase; transition: all var(--tr);
    }
    .hero__cta:hover {
      background: var(--cl-white); color: var(--cl-ink-0); border-color: var(--cl-white);
    }
    .hero__scroll {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      color: rgba(253,249,244,.5); font-size: .65rem; letter-spacing: .25em;
      text-transform: uppercase; display: flex; flex-direction: column; align-items: center;
      gap: .4rem; animation: bob 2.2s ease-in-out infinite;
    }
    .hero__scroll::after {
      content: ''; display: block; width: 1px; height: 36px;
      background: rgba(253,249,244,.35);
    }
    @keyframes bob {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(7px); }
    }

    /* ================================================
       ABOUT — Chi siamo
    ================================================ */
    .about { background: var(--cl-white); }
    .about__grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4.5rem; align-items: center;
    }
    .about__img {
      border-radius: var(--r-lg); overflow: visible; aspect-ratio: 4/5;
      position: relative;
    }
    .about__img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      border-radius: var(--r-lg);
    }
    /* Cornicetta decorativa offset in basso-destra */
    .about__img::after {
      content: ''; position: absolute;
      bottom: -18px; right: -18px;
      width: 100px; height: 100px;
      border: 2px solid var(--cl-terra-2); border-radius: var(--r-md); opacity: .35;
      pointer-events: none;
    }
    .about__body { font-size: .97rem; color: var(--cl-ink-1); font-weight: 300; line-height: 1.9; }
    .about__body p + p { margin-top: 1rem; }
    .about__tags { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 2rem; }
    .about__tag {
      padding: .35rem 1rem; background: var(--cl-beige-1); border-radius: var(--r-pill);
      font-size: .75rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--cl-ink-1);
    }

    /* ================================================
       MENU
    ================================================ */
    .menu { background: var(--cl-beige-0); }
    .menu__hd { text-align: center; margin-bottom: 3rem; }

    .menu__tabs {
      display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-bottom: 2.5rem;
    }
    .tab {
      padding: .5rem 1.2rem; background: none;
      border: 1.5px solid var(--cl-beige-3); border-radius: var(--r-pill);
      font-size: .78rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--cl-ink-2); transition: all var(--tr);
    }
    .tab:hover, .tab.active {
      background: var(--cl-terra-2); border-color: var(--cl-terra-2); color: var(--cl-white);
    }

    .menu__cat { display: none; }
    .menu__cat.active { display: block; animation: fadeUp .3s ease both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .menu__cat-title {
      font-size: 1.5rem; text-align: center; color: var(--cl-ink-0); margin-bottom: .4rem;
    }
    .menu__cat-desc {
      text-align: center; font-size: .88rem; color: var(--cl-ink-2);
      font-weight: 300; margin-bottom: 2rem;
    }
    .menu__grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.1rem;
    }
    .menu-card {
      background: var(--cl-white); border-radius: var(--r-md); padding: 1.4rem;
      box-shadow: var(--sh-sm); border-left: 3px solid var(--cl-beige-3);
      transition: box-shadow var(--tr), transform var(--tr);
    }
    .menu-card:hover { box-shadow: var(--sh-md); transform: translateY(-3px); }
    /* accent color per categoria */
    [data-cat="hot"]     .menu-card { border-left-color: var(--cl-terra-2); }
    [data-cat="iced"]    .menu-card { border-left-color: var(--cl-sage-2); }
    [data-cat="coffee"]  .menu-card { border-left-color: #9c7040; }
    [data-cat="bottles"] .menu-card { border-left-color: var(--cl-sage-3); }
    [data-cat="sweets"]  .menu-card { border-left-color: var(--cl-terra-1); }

    .menu-card__icon { font-size: 1.4rem; margin-bottom: .65rem; }
    .menu-card__name {
      font-family: 'Playfair Display', serif; font-size: 1.05rem;
      font-weight: 600; color: var(--cl-ink-0); margin-bottom: .35rem;
    }
    .menu-card__desc {
      font-size: .83rem; color: var(--cl-ink-2); font-weight: 300;
      line-height: 1.6; margin-bottom: .9rem;
    }
    .menu-card__price {
      font-family: 'Playfair Display', serif; font-size: 1.05rem;
      font-weight: 600; color: var(--cl-terra-2);
    }
    .menu-card__price small {
      font-family: 'Lato', sans-serif; font-size: .72rem;
      color: var(--cl-ink-3); font-weight: 400; margin-left: .3rem;
    }

    /* ================================================
       CONTATTI — Orari & Contatti
    ================================================ */
    .contacts { background: var(--cl-white); }
    .contacts__grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4.5rem; align-items: start;
    }

    .hours { margin-top: 1.75rem; }
    .hours__row {
      display: flex; justify-content: space-between; align-items: center;
      padding: .7rem 0; border-bottom: 1px solid var(--cl-beige-1);
    }
    .hours__row:last-child { border-bottom: none; }
    .hours__day   { font-size: .9rem; color: var(--cl-ink-1); }
    .hours__time  { font-family: 'Playfair Display', serif; font-size: .92rem; color: var(--cl-ink-0); font-weight: 600; }
    .hours__time.closed {
      font-family: 'Lato', sans-serif; font-weight: 300;
      font-style: italic; font-size: .85rem; color: var(--cl-ink-3);
    }

    .address-box {
      display: flex; gap: .9rem; align-items: flex-start;
      padding: 1.3rem; background: var(--cl-beige-0); border-radius: var(--r-md); margin-top: 2rem;
    }
    .address-box__icon { font-size: 1.3rem; flex-shrink: 0; margin-top: 2px; }
    .address-box h4 {
      font-family: 'Playfair Display', serif; font-size: .95rem;
      color: var(--cl-ink-0); margin-bottom: .25rem;
    }
    .address-box p { font-size: .88rem; color: var(--cl-ink-2); font-weight: 300; line-height: 1.6; }

    .socials { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.75rem; }
    .social-btn {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .65rem 1.3rem; border-radius: var(--r-pill);
      background: var(--cl-beige-0); color: var(--cl-ink-1);
      font-size: .82rem; font-weight: 700; letter-spacing: .04em; transition: all var(--tr);
    }
    .social-btn:hover { color: var(--cl-white); }
    .social-btn.ig:hover { background: #e1306c; }
    .social-btn.wa:hover { background: #25d366; }

    /* Map placeholder — sostituire con iframe Google Maps */
    .map-ph {
      border-radius: var(--r-lg); aspect-ratio: 1;
      background: linear-gradient(145deg, var(--cl-beige-1), var(--cl-beige-2));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; color: var(--cl-ink-2); font-size: .85rem; text-align: center;
    }
    .map-ph__icon { font-size: 3rem; opacity: .45; }

    /* ================================================
       LOGIN
    ================================================ */
    .login { background: var(--cl-beige-0); }
    .login__wrap { max-width: 430px; margin: 0 auto; }
    .login__hd   { text-align: center; margin-bottom: 2.25rem; }

    .login__card {
      background: var(--cl-white); border-radius: var(--r-lg);
      padding: 2.5rem 2.25rem; box-shadow: var(--sh-md);
    }
    .login__note {
      text-align: center; font-size: .82rem; color: var(--cl-ink-3);
      font-style: italic; margin-bottom: 1.75rem;
    }
    .field        { margin-bottom: 1.2rem; }
    .field__label {
      display: block; font-size: .75rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--cl-ink-1); margin-bottom: .45rem;
    }
    .field__input {
      width: 100%; padding: .82rem 1rem;
      background: var(--cl-beige-0); border: 1.5px solid var(--cl-beige-2);
      border-radius: var(--r-sm); font-family: 'Lato', sans-serif; font-size: .94rem;
      color: var(--cl-ink-0); outline: none; transition: border-color var(--tr), box-shadow var(--tr);
    }
    .field__input:focus {
      border-color: var(--cl-sage-2); box-shadow: 0 0 0 3px rgba(138,158,122,.18);
    }
    .field__input::placeholder { color: var(--cl-ink-3); }

    .btn-login {
      width: 100%; margin-top: .35rem; padding: .92rem;
      background: var(--cl-terra-2); color: var(--cl-white); border: none;
      border-radius: var(--r-sm); font-size: .88rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; transition: all var(--tr);
    }
    .btn-login:hover:not(:disabled) {
      background: var(--cl-terra-3); transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(196,113,78,.38);
    }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.35); border-top-color: white;
      border-radius: 50%; animation: spin .65s linear infinite;
      vertical-align: middle; margin-right: .45rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-err {
      display: none; margin-top: 1rem; padding: .8rem 1rem;
      background: #fef2ef; border: 1px solid #f8c7b8; border-radius: var(--r-sm);
      color: #a03820; font-size: .85rem; text-align: center;
    }
    .login-err.show { display: block; }

    /* ================================================
       FOOTER
    ================================================ */
    footer {
      background: var(--cl-ink-0); color: rgba(253,249,244,.55);
      text-align: center; padding: 2.25rem 1rem;
      font-size: .8rem; font-weight: 300; letter-spacing: .04em; line-height: 1.9;
    }
    footer strong { font-family: 'Playfair Display', serif; color: rgba(253,249,244,.9); }

    /* ================================================
       RESPONSIVE
    ================================================ */
    @media (max-width: 880px) {
      .about__grid, .contacts__grid { grid-template-columns: 1fr; gap: 2.5rem; }
      .about__img { aspect-ratio: 16/9; max-width: 520px; }
      .map-ph     { aspect-ratio: 16/9; }
      .nav__links { display: none; }
      .hamburger  { display: flex; }
    }
    @media (max-width: 560px) {
      .section    { padding: 3.75rem 0; }
      .hero__content { padding: 8rem 1rem 4rem; }
      .login__card   { padding: 1.75rem 1.25rem; }
      .menu__grid    { grid-template-columns: 1fr; }
      .socials       { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- ================================================
     NAVBAR
     MODIFICA: nome locale nel logo (cerca "nav__logo")
================================================ -->
<nav class="nav" id="navbar">
  <div class="container">
    <div class="nav__inner">
      <a href="#home" class="nav__logo">
        <img src="Images/logo.png" alt="El Rincón de Liper" class="nav__logo-img" />
      </a>

      <ul class="nav__links" id="desktopLinks">
        <li><a href="#chi-siamo" data-i18n="nav_about"></a></li>
        <li><a href="#menu"      data-i18n="nav_menu"></a></li>
        <li><a href="#contatti"  data-i18n="nav_contacts"></a></li>
        <li><a href="#login"     data-i18n="nav_login"></a></li>
        <li>
          <div class="lang">
            <button class="lang__btn" data-lang="es">ES</button>
            <button class="lang__btn" data-lang="it">IT</button>
            <button class="lang__btn" data-lang="en">EN</button>
          </div>
        </li>
      </ul>

      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="mobile-drawer" id="drawer">
      <a href="#chi-siamo" data-i18n="nav_about"></a>
      <a href="#menu"      data-i18n="nav_menu"></a>
      <a href="#contatti"  data-i18n="nav_contacts"></a>
      <a href="#login"     data-i18n="nav_login"></a>
      <div class="lang">
        <button class="lang__btn" data-lang="es">ES</button>
        <button class="lang__btn" data-lang="it">IT</button>
        <button class="lang__btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</nav>

<!-- ================================================
     HOME / HERO
     MODIFICA: testi in CONFIG.hero.*
     IMMAGINE: aggiungere background-image a .hero__bg in CSS
================================================ -->
<section id="home" class="hero">
  <div class="hero__bg"></div>
  <div class="hero__overlay"></div>
  <div class="hero__content">
    <p class="hero__eyebrow" data-i18n="hero_eyebrow"></p>
    <h1 class="hero__title">El Rincón<br><em>de Liper</em></h1>
    <p class="hero__sub" data-i18n="hero_sub"></p>
    <a href="#menu" class="hero__cta" data-i18n="hero_cta"></a>
  </div>
  <span class="hero__scroll" aria-hidden="true">scroll</span>
</section>

<!-- ================================================
     CHI SIAMO / ABOUT
     MODIFICA: testi in CONFIG.about.*
     IMMAGINE PLACEHOLDER: il div .about__img
================================================ -->
<section id="chi-siamo" class="section about">
  <div class="container">
    <div class="about__grid">
      <div class="about__img">
        <img src="Images/img1.png" alt="Una tazza di tè al Rincón de Liper" loading="lazy" />
      </div>
      <div class="about__text">
        <span class="eyebrow" data-i18n="about_eyebrow"></span>
        <h2 class="title"     data-i18n="about_title"></h2>

/* ================================================================
   i18n ENGINE
================================================================ */
let lang = localStorage.getItem('liper_lang') || 'es';

function t(k) { return TR[lang][k] || TR.es[k] || k; }

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.querySelectorAll('.lang__btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.documentElement.lang = lang;
  renderMenu();
  renderHours();
  renderAddress();
}

function setLang(l) {
  if (!TR[l]) return;
  lang = l;
  localStorage.setItem('liper_lang', l);
  applyLang();
}

document.querySelectorAll('.lang__btn').forEach(b => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

================================================================ */
function getActiveCat() {
  const t = document.querySelector('.tab.active');
  return t ? t.dataset.category : CONFIG.menu.categories[0].id;
}

function renderMenu() {
  const activeCat = getActiveCat();

  /* tabs */
  const tabsEl = document.getElementById('menuTabs');
  tabsEl.innerHTML = CONFIG.menu.categories.map(cat =>
    `<button class="tab${cat.id === activeCat ? ' active' : ''}" data-category="${cat.id}">
       ${cat.name[lang] || cat.name.es}
     </button>`
  ).join('');

  /* categories */
  const content = document.getElementById('menuContent');
  content.innerHTML = CONFIG.menu.categories.map(cat => {
    const items = cat.items.map(item => `
      <div class="menu-card">
        <div class="menu-card__icon">${cat.icon}</div>
        <h3 class="menu-card__name">${item.name}</h3>
        <p class="menu-card__desc">${item.desc[lang] || item.desc.es}</p>
        <p class="menu-card__price">${CONFIG.menu.currency} ${item.price}
          <small>${cat.name[lang] || cat.name.es}</small>
        </p>
      </div>`).join('');
    return `
      <div class="menu__cat${cat.id === activeCat ? ' active' : ''}" id="cat-${cat.id}" data-cat="${cat.id}">
        <h3 class="menu__cat-title">${cat.icon} ${cat.name[lang] || cat.name.es}</h3>
        <p class="menu__cat-desc">${cat.desc[lang] || cat.desc.es}</p>
        <div class="menu__grid">${items}</div>
      </div>`;
  }).join('');

  /* re-bind tab clicks */
  document.getElementById('menuTabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.menu__cat').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    const cat = document.getElementById('cat-' + btn.dataset.category);
    if (cat) cat.classList.add('active');
  }, { once: true });
}

/* ================================================================
   RENDER HOURS & ADDRESS & SOCIAL
================================================================ */
function renderHours() {
  document.getElementById('hoursList').innerHTML =
    CONFIG.contacts.hours.map(row => {
      const timeHtml = row.time
        ? `<span class="hours__time">${row.time}</span>`
        : `<span class="hours__time closed">${CONFIG.contacts.closedLabel[lang] || 'Cerrado'}</span>`;
      return `<div class="hours__row">
                <span class="hours__day">${row.day[lang] || row.day.es}</span>
                ${timeHtml}
              </div>`;
    }).join('');
}

function renderAddress() {
  document.getElementById('addressText').textContent =
    CONFIG.contacts.address[lang] || CONFIG.contacts.address.es;
  document.getElementById('igLink').href = CONFIG.contacts.instagram;
  document.getElementById('waLink').href = CONFIG.contacts.whatsapp;
}

/* ================================================================
   NAVBAR — scroll shadow & hamburger
================================================================ */
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', scrollY > 44);
}, { passive: true });

const ham = document.getElementById('hamburger');
const drawer = document.getElementById('drawer');
ham.addEventListener('click', () => {
  const open = drawer.classList.toggle('open');
  ham.classList.toggle('open', open);
});
drawer.querySelectorAll('a').forEach(a =>
  a.addEventListener('click', () => {
    drawer.classList.remove('open');
    ham.classList.remove('open');
  })
);

/* ================================================================
   LOGIN FORM
   POST → CONFIG.API_URL + "/auth/login"
   Body: { email, password }
   Risposta attesa: { token: "..." }   (oppure access_token / jwt)
================================================================ */
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn      = document.getElementById('loginBtn');
  const btnTxt   = document.getElementById('loginBtnTxt');
  const errBox   = document.getElementById('loginErr');

  errBox.classList.remove('show');
  errBox.textContent = '';

  if (!email || !password) return;

  /* stato caricamento */
  btn.disabled   = true;
  btnTxt.innerHTML = `<span class="spinner"></span>${t('login_loading')}`;

  try {
    const res = await fetch(`${CONFIG.API_URL}/auth/login`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email, password })
    });

    if (res.ok) {
      const data = await res.json();
      const token = data.token || data.access_token || data.jwt || '';
      localStorage.setItem('liper_token', token);
      window.location.href = CONFIG.DASHBOARD_URL;

    } else if (res.status === 401 || res.status === 403) {
      showErr(t('err_invalid'));
    } else {
      showErr(t('err_generic'));
    }

  } catch (_) {
    showErr(t('err_network'));

  } finally {
    btn.disabled  = false;
    btnTxt.textContent = t('login_btn');
  }
});

function showErr(msg) {
  const el = document.getElementById('loginErr');
  el.textContent = msg;
  el.classList.add('show');
}

/* ================================================================
   FOOTER YEAR
================================================================ */
document.getElementById('footerYear').textContent = new Date().getFullYear();

/* ================================================================
   BOOT
================================================================ */
applyLang();
</script>
